    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#135bec",
              "background-light": "#f6f6f8",
              "background-dark": "#0F172A",
              "surface-light": "#ffffff",
              "surface-dark": "#1E293B",
              "card-light": "#ffffff",
              "card-dark": "#1e2736",
              "border-light": "#e5e7eb",
              "border-dark": "#334155",
              "text-secondary-light": "#64748b",
              "text-secondary-dark": "#94a3b8",
              tg: {
                blue: "#24A1DE",
                dark: "#17212B",
                msg: "#182533",
                out: "#2B5278"
              }
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            boxShadow: {
              glow: "0 0 40px -10px rgba(19, 91, 236, 0.3)",
              tg: "0 1px 2px rgba(0,0,0,0.2)"
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'breathe': 'breathe 4s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
              'shimmer': 'shimmer 2s infinite linear',
              'rainbow-border': 'rainbow 4s infinite linear',
              'cosmic-rotate': 'cosmic-rotate 10s linear infinite',
              'solar-flare': 'solar-flare 3s ease-in-out infinite',
              'deep-flow': 'deep-flow 5s ease-in-out infinite',
              'bounce-custom': 'bounce-custom 2s ease-in-out infinite'
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              breathe: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.05)' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%) translateY(-100%) rotate(45deg)' },
                '100%': { transform: 'translateX(100%) translateY(100%) rotate(45deg)' },
              },
              'bounce-custom': {
                '0%, 100%': { transform: 'translateY(0) scale(1)' },
                '50%': { transform: 'translateY(-15px) scale(1.05)' },
              },
              rainbow: {
                '0%': { borderColor: '#f43f5e' },
                '25%': { borderColor: '#eab308' },
                '50%': { borderColor: '#10b981' },
                '75%': { borderColor: '#3b82f6' },
                '100%': { borderColor: '#f43f5e' },
              },
              'cosmic-rotate': {
                '0%': { transform: 'rotate(0deg) scale(1)' },
                '50%': { transform: 'rotate(180deg) scale(1.1)' },
                '100%': { transform: 'rotate(360deg) scale(1)' }
              },
              'solar-flare': {
                '0%, 100%': { boxShadow: '0 0 20px #f59e0b, inset 0 0 10px #f59e0b', borderColor: '#f59e0b' },
                '50%': { boxShadow: '0 0 40px #ef4444, inset 0 0 20px #ef4444', borderColor: '#ef4444' }
              },
              'deep-flow': {
                '0%, 100%': { boxShadow: '0 0 20px #0ea5e9', borderColor: '#0ea5e9' },
                '50%': { boxShadow: '0 0 40px #6366f1', borderColor: '#6366f1' }
              }
            }
          },
        },
      };
    </script>
